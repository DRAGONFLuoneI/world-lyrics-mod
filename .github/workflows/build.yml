name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: worldlyrics-1.20.1
          path: build/libs/*.jar

      # Готовый .jar — в релиз (удобно скачать со страницы Releases)
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: World Lyrics 1.0.0 (build ${{ github.run_number }})
          files: build/libs/*.jar
          body: Мод для Minecraft 1.20.1 Forge. Положите .jar в папку .minecraft/mods. Нужна программа Lyrics Overlay 2.1+.

      # …и в ветку dist, чтобы файл можно было забрать обычным git
      - name: Publish to dist branch
        run: |
          mkdir /tmp/dist && cp build/libs/*.jar /tmp/dist/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf . > /dev/null
          cp /tmp/dist/*.jar .
          git add *.jar
          git commit -m "Build ${{ github.run_number }}"
          git push -f origin dist
